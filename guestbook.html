<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Casper's Haunted Guestbook</title>
        <meta name="author" content="Casper" />
        <meta
            name="description"
            content="This haunted guestbook documents all who have floated though."
        />
        <link href="guestbookAssets/guestbookStyle.css" rel="stylesheet" type="text/css" media="all" />
        <link href="mainStyle.css" rel="stylesheet" type="text/css" media="all" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Jolly+Lodger&family=Pangolin&display=swap"
            rel="stylesheet"
        />
        <script type="text/javascript">
        var onloadCallback = function() {

            });
        };
    </script>
        <script src="sidebar.js" type="text/javascript" defer></script>
    </head>
    <body>
        <header>
            <h1>Casper's Haunted Guestbook</h1>
        </header>

        <div id="content">
            <aside id="sidebar">
                <sidebar-component></sidebar-component>
            </aside>

            <main>
                <!--the "top" id gives it a special look. search "#top" in the css to edit them!-->
                <article id="top" class="clearfix">
                    <div class="img-right" id="character">
                        <img src="images/Caz_The_Friendly_Enby_Ghost_enbyedition.png" alt="yours truly"/>
                    </div>
                    <section>
                        <h1> Please sign my Guestbook </h1>
                        <p>
                            Anything you fill out here will be added to the guestbook below!
                        </p>
                    </section>
                    <br>
                    <section style="width: 80%">
                        <div class="links">
                            <a href="#SignGuestBook"><img src="images/signButton.gif" alt="Sign the Guestbook" style="scale: 1.2"></a>
                            <a onClick="window.location.reload();"><img src="images/refreshButton.gif" alt="Refresh the Guestbook" style="scale: 1.2"></a>
                        </div>
                    </section>
                </article>
                <section>
                    <div id="GuestBook">
                        <div class="container">

                        <div id="SignGuestBook" class="overlay">
                            <div id="SendForm" class="sign-guest-book-popup">
                                <h1>Sign The Guestbook</h1>
                                <a class="close" href="#">&times;</a>
                                <div class="content">
                                    <label style="display: block;
                                        text-align: center;" class="aterisk_before" for="gform"> indicates a required field</label>
                                    <form name="gform" id="gform" enctype="text/plain" action="GOOGLE_FORM_URL" target="hidden_iframe" onsubmit="submitted=true;">

                                        <label for="GOOGLE_ENTRY_ID_Name"  class="aterisk_after"> Name </label>

                                        <input class="form-element short" type="text" name="GOOGLE_ENTRY_ID_Name" id="GOOGLE_ENTRY_ID_Name" placeholder="Anon" style="background: #cc66da;" required>

                                        <label for="GOOGLE_ENTRY_ID_TextArea"  class="max-length">Guestbook Entry</label>

                                        <textarea class="form-element" name="GOOGLE_ENTRY_ID_TextArea" id="GOOGLE_ENTRY_ID_TextArea" rows="5" cols="30" oninvalid="this.setCustomValidity('You must sign the guestbook')"
                                                  oninput="this.setCustomValidity('')"  maxlength="50" placeholder="Enter Your Message Here" required></textarea>

                                        <label for="html_element"  class="aterisk_after">Captcha</label>
                                        <div id="html_element"></div>
                                    <script src="https://www.google.com/recaptcha/api.js?onload=onloadCallback&render=explicit"
                                            async defer>
                                    </script>

                                        <input class="form-button" type="submit" value="Submit">
                                        <input class="form-button" type="reset" value="Reset Form">

                                    </form>
                                </div>
                            </div>
                        </div>
                        <iframe name="hidden_iframe" id="hidden_iframe" style="display:none;"></iframe>

                        <div id="AllEntries" class="overlay">
                            <div class="popup">
                                <h2>All Entries</h2>
                                <a class="close" href="#">&times;</a>
                                <div id="AllEntries_Content" class="content" style="height: 25em;overflow-y: auto;">
                                </div>
                            </div>
                        </div>
                    </div>
    <script type="text/javascript">


        // Put your Google Entry Form ID(s) Here
        var GOOGLE_ENTRY_ID_Name="entry.1965994493";   // Name Entry ID
        
        var GOOGLE_ENTRY_ID_Guestbook="entry.1224872116"; // Guestbook Entry ID

        var Google_Form_Link="https://docs.google.com/forms/d/e/1FAIpQLSdup0c0MRmNcA6wbweDT3ZUY-iKw_zS1UAK9wSBK6KzClG9dA/formResponse?"
        
        var Google_Form_ID="16dONAJWIZConHYYXEM1ImUIr9TWFLm2dvNLnsw0rmv8"

    </script>

    <script src="guestbookAssets/guest-book-WIP.js"></script>

                    </section>
                    </div>
                </section>
            </main>
        </div>

        <footer>© 2025 Casper Helliwell</footer>

</html>
